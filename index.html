<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 찾기</title>
<style>
  *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --c: 42px; --ink: #1d1a17; --paper: #f6f3ea; --line: #e3dfd2;
    --tile: #dcdad2; --hatch: #8c8a82; --brown: #8a4b1d; --brown-d: #5a2f10; --belly: #cf9a62;
    --hand: "Ink Free", "Segoe Print", "Comic Sans MS", "Nanum Pen Script", cursive;
  }
  html, body { min-height: 100%; }
  body {
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
    color: var(--ink); font-family: var(--hand);
    user-select: none; -webkit-user-select: none;
    display: flex; justify-content: center; padding: 34px 18px 40px;
  }
  .rough0 { filter: url(#rough0); } .rough1 { filter: url(#rough1); } .rough2 { filter: url(#rough2); }

  /* 겹쳐 놓은 종이 같은 창 */
  .stage { position: relative; display: inline-block; }
  .win { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 6px 10px 7px 12px; padding: 14px 22px 22px; z-index: 1; }
  .win:before { content: ""; position: absolute; inset: 7px -9px -9px 7px; border: 3px solid var(--ink); border-radius: 8px 12px 9px 14px; z-index: -1; background: var(--paper); }
  .win:after  { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .win-head { display: flex; justify-content: space-between; align-items: center; font-size: 22px; margin-bottom: 14px; }
  #diff { font: inherit; font-size: 22px; background: none; border: none; color: var(--ink); cursor: pointer; text-decoration: underline wavy rgba(0,0,0,.25); text-underline-offset: 5px; }
  #diff:active { transform: translate(1px, 1px); }

  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    border: 3px solid var(--ink); border-radius: 5px 9px 6px 10px; padding: 8px 20px 6px; margin-bottom: 20px; background: var(--paper); position: relative; }
  .score:before { content: ""; position: absolute; inset: 5px -6px -6px 5px; border: 3px solid var(--ink); border-radius: 6px 10px 7px 11px; z-index: -1; }
  .stat small { display: block; font-size: 17px; opacity: .8; }
  .stat .num { font-size: 46px; line-height: 44px; letter-spacing: 4px; font-weight: bold; }
  .stat.r { text-align: right; }
  #face { width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #face:active { transform: translate(1px, 1px); }
  #face svg { width: 100%; height: 100%; }

  #grid { display: grid; width: max-content; margin: 0 auto; padding: 2px; position: relative; }
  .cell { position: relative; width: var(--c); height: var(--c); padding: 2px; }
  .tile { position: absolute; inset: 2px; border-radius: 3px 5px 3px 6px; }
  .tile.cover { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--hatch) 6px 7.2px), var(--tile); border: 2.6px solid var(--ink); }
  .tile.open  { background: transparent; border: 1.6px dashed #a9a597; }
  .cell svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .cell.top { z-index: 6; }
  .cell.press .tile.cover { background: transparent; border: 1.6px dashed #a9a597; }

  /* 뽕! */
  .anim .mole { transform-box: fill-box; transform-origin: 50% 100%; animation: pop .42s cubic-bezier(.2, 1.9, .4, 1) both; animation-delay: var(--d, 0s); }
  .cell.top.anim .mole { animation-name: pop-big; animation-delay: 0s; }
  @keyframes pop { 0% { transform: translateY(70%) scaleY(.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; } }
  @keyframes pop-big { 0% { transform: translateY(70%) scale(.2); opacity: 0; } 30% { opacity: 1; } 70% { transform: translateY(-14%) scale(1.9); } 100% { transform: translateY(-4%) scale(1.7); } }
  .bubble { position: absolute; left: 50%; bottom: 100%; margin-bottom: 18px; z-index: 9; pointer-events: none;
    transform: translate(-50%, 0) rotate(-8deg); font-size: 30px; font-weight: bold; white-space: nowrap; line-height: 1; }
  .bubble svg { position: absolute; inset: -14px -16px; width: calc(100% + 32px); height: calc(100% + 28px); overflow: visible; }
  .anim .bubble { animation: boing .5s cubic-bezier(.2, 2, .4, 1) both; }
  @keyframes boing { 0% { transform: translate(-50%, 18px) scale(.1) rotate(-8deg); } 100% { transform: translate(-50%, 0) scale(1) rotate(-8deg); } }
  .shake { animation: shake .35s linear; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, -1px); } 80% { transform: translate(3px, 2px); } }
  .hint { text-align: center; margin-top: 22px; font-size: 16px; opacity: .65; width: 0; min-width: 100%; }

  /* 터치 대응 */
  html, body { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #grid, .cell, #face, #diff, #flagmode { touch-action: manipulation; }
  .win-head .tools { display: flex; align-items: center; gap: 14px; }
  #flagmode { font: inherit; font-size: 20px; color: var(--ink); background: #fff; cursor: pointer;
    border: 2.5px solid var(--ink); border-radius: 8px 4px 9px 5px; padding: 0 10px; line-height: 30px; }
  #flagmode.on { background: var(--ink); color: #fff; }
  #flagmode:active { transform: translate(1px, 1px); }
  /* 꾹 누르기 진행 표시: 칸 위에 원이 차오른다 */
  .cell.holding:after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border: 3px solid var(--ink); border-radius: 50%; z-index: 7; pointer-events: none; animation: hold .4s linear forwards; }
  @keyframes hold { from { transform: scale(.3); opacity: .9; } to { transform: scale(3.4); opacity: .15; } }
  .cell.holding .tile.cover { background: transparent; border: 1.6px dashed #a9a597; }
  @media (max-width: 520px) {
    body { padding: 12px 8px 28px; }
    .win { padding: 10px 12px 16px; }
    .win-head { font-size: 19px; margin-bottom: 10px; }
    #diff { font-size: 19px; } #flagmode { font-size: 17px; line-height: 26px; }
    .score { padding: 6px 12px 4px; gap: 6px; margin-bottom: 14px; }
    .stat small { font-size: 14px; } .stat .num { font-size: 34px; line-height: 34px; letter-spacing: 2px; }
    #face { width: 60px; height: 60px; }
    .hint { font-size: 14px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rough0" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
    <filter id="rough1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="27"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
  </defs>
</svg>

<div class="stage" id="stage">
  <div class="win rough0">
    <div class="win-head"><span>게임</span><div class="tools"><button id="flagmode" aria-pressed="false">깃발 모드</button><button id="diff"></button></div></div>
    <div class="score rough1">
      <div class="stat"><small>남은 두더지</small><div class="num" id="remain"></div></div>
      <button id="face"></button>
      <div class="stat r"><small>시간</small><div class="num" id="secs"></div></div>
    </div>
    <div id="grid"></div>
  </div>
  <p class="hint" id="hint"></p>
</div>

<script>
/* ===== 게임 로직: winxp.vercel.app Minesweeper 와 동일 (지뢰 → 두더지로 이름만 변경) ===== */
const Config = {
  Beginner:     { rows: 9,  columns: 9,  ceils: 81,  mines: 10 },
  Intermediate: { rows: 16, columns: 16, ceils: 256, mines: 40 },
  Expert:       { rows: 16, columns: 30, ceils: 480, mines: 99 },
};
const ORDER = ['Beginner', 'Intermediate', 'Expert'];
const LABEL = { Beginner: '초급', Intermediate: '중급', Expert: '고급' };

function sampleSize(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function getNearIndexes(index, rows, columns) {
  if (index < 0 || index >= rows * columns) return [];
  const row = Math.floor(index / columns), column = index % columns;
  return [index - columns - 1, index - columns, index - columns + 1, index - 1, index + 1,
          index + columns - 1, index + columns, index + columns + 1].filter((_, k) => {
    if (row === 0 && k < 3) return false;
    if (row === rows - 1 && k > 4) return false;
    if (column === 0 && [0, 3, 5].includes(k)) return false;
    if (column === columns - 1 && [2, 4, 7].includes(k)) return false;
    return true;
  });
}
function genGameConfig({ rows, columns, mines }) {
  return { rows, columns, mines, ceils: Array(rows * columns).fill().map(() => ({ state: 'cover', minesAround: 0, opening: false })) };
}
function getInitState(difficulty = 'Beginner') { return { difficulty, status: 'new', ...genGameConfig(Config[difficulty]) }; }
function insertMines(config, originCeils) {
  const { rows, columns, mines, exclude } = config;
  const ceils = originCeils.map(c => ({ ...c }));
  const idx = [...Array(rows * columns).keys()];
  sampleSize(idx.filter(i => i !== exclude), mines).forEach(chosen => {
    ceils[chosen].minesAround = -10;
    getNearIndexes(chosen, rows, columns).forEach(n => { ceils[n].minesAround += 1; });
  });
  return { rows, columns, ceils, mines };
}
function autoCeils(state, index) {
  const { rows, columns } = state;
  const ceils = state.ceils.map(c => ({ ...c, walked: false }));
  function walk(i) {
    const c = ceils[i];
    if (c.walked || c.minesAround < 0 || c.state === 'flag') return [];
    c.walked = true;
    if (c.minesAround > 0) return [i];
    return [i, ...getNearIndexes(i, rows, columns).reduce((acc, n) => [...acc, ...walk(n)], [])];
  }
  return walk(index);
}
function reducer(state, action) {
  switch (action.type) {
    case 'CLEAR_MAP': return getInitState(action.payload || state.difficulty);
    case 'START_GAME': return { ...state, ...insertMines({ ...Config[state.difficulty], exclude: action.payload }, state.ceils), status: 'started' };
    case 'OPEN_CEIL': {
      const ceils = [...state.ceils];
      autoCeils(state, action.payload).forEach(i => { ceils[i] = { ...ceils[i], state: 'open' }; });
      return { ...state, ceils };
    }
    case 'CHANGE_CEIL_STATE': {
      const ceils = [...state.ceils]; const c = ceils[action.payload];
      ceils[action.payload] = { ...c, state: { cover: 'flag', flag: 'unknown', unknown: 'cover' }[c.state] };
      return { ...state, ceils };
    }
    case 'GAME_OVER': {
      const ceils = state.ceils.map(c => {
        if (c.minesAround < 0 && c.state !== 'flag') return { ...c, state: 'mine' };
        if (c.state === 'flag' && c.minesAround >= 0) return { ...c, state: 'misflagged' };
        return { ...c, opening: false };
      });
      ceils[action.payload].state = 'die';
      return { ...state, status: 'died', ceils };
    }
    case 'WON': return { ...state, status: 'won', ceils: state.ceils.map(c => c.minesAround >= 0 ? { ...c, state: 'open' } : { ...c, state: 'flag' }) };
    case 'OPENING_CEIL': {
      const ceils = state.ceils.map(c => ({ ...c, opening: false }));
      if (action.payload >= 0) ceils[action.payload] = { ...state.ceils[action.payload], opening: true };
      return { ...state, ceils };
    }
    case 'OPENING_CEILS': {
      const near = getNearIndexes(action.payload, state.rows, state.columns);
      const ceils = state.ceils.map(c => ({ ...c, opening: false }));
      [...near, action.payload].forEach(i => { ceils[i] = { ...ceils[i], opening: true }; });
      return { ...state, ceils };
    }
    default: return state;
  }
}

let state = getInitState('Beginner');
let seconds = 0, timer = null, lastStatus = null, renderedStatus = null;
let mouseDownContent = false;
let openBehavior = { index: -1, behavior: '' };
let flagMode = false;            // 깃발 모드: 탭이 깃발 설치로 바뀜
let lastTouch = 0;               // 터치 직후 따라오는 가짜 마우스 이벤트 무시용
let touch = null;                // 진행 중인 터치 { id, idx, x, y, timer, long, el }
let touchHint = false;
const LONG_PRESS_MS = 400, MOVE_CANCEL_PX = 10;

const dispatch = a => { state = reducer(state, a); };
const remains = () => state.ceils.filter(c => c.state !== 'open').filter(c => c.minesAround >= 0).length;
function syncTimer() {
  if (state.status === lastStatus) return;
  lastStatus = state.status; clearInterval(timer); timer = null;
  if (state.status === 'started') timer = setInterval(() => { seconds += 1; renderScore(); }, 1000);
  else if (state.status === 'new') seconds = 0;
}
function commit() {
  if (state.status === 'started' && remains() === 0) dispatch({ type: 'WON' });
  syncTimer(); render();
}

function changeCeilState(index) {
  const c = state.ceils[index];
  if (c.state === 'open' || ['won', 'died'].includes(state.status)) return;
  dispatch({ type: 'CHANGE_CEIL_STATE', payload: index });
}
function openCeil(index) {
  switch (state.status) {
    case 'new': dispatch({ type: 'START_GAME', payload: index }); dispatch({ type: 'OPEN_CEIL', payload: index }); break;
    case 'started': {
      const c = state.ceils[index];
      if (['flag', 'open'].includes(c.state)) break;
      if (c.minesAround < 0) dispatch({ type: 'GAME_OVER', payload: index }); else dispatch({ type: 'OPEN_CEIL', payload: index });
    }
  }
}
function openCeils(index) {
  const c = state.ceils[index];
  if (c.state !== 'open' || c.minesAround <= 0 || state.status !== 'started') return;
  const idxs = getNearIndexes(index, state.rows, state.columns);
  if (idxs.map(i => state.ceils[i]).filter(x => x.state === 'flag').length !== c.minesAround) return;
  const mineIndex = idxs.find(i => state.ceils[i].minesAround < 0 && state.ceils[i].state !== 'flag');
  if (mineIndex) dispatch({ type: 'GAME_OVER', payload: mineIndex });
  else idxs.forEach(i => dispatch({ type: 'OPEN_CEIL', payload: i }));
}
const openingCeil = i => { if (!['died', 'won'].includes(state.status)) dispatch({ type: 'OPENING_CEIL', payload: i }); };
const openingCeils = i => { if (!['died', 'won'].includes(state.status)) dispatch({ type: 'OPENING_CEILS', payload: i }); };

/* ===== 손그림 (레퍼런스: 해칭 회색 타일 + 갈색 두더지) ===== */
const INK = '#1d1a17', BROWN = '#8a4b1d', BELLY = '#cf9a62';
const HAND = `font-family="'Ink Free','Segoe Print','Comic Sans MS',cursive"`;
const S = (inner, vb = '0 0 42 42') => `<svg viewBox="${vb}" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

const numArt = n => S(`<text x="21" y="30" text-anchor="middle" font-size="27" font-weight="bold" fill="${INK}" stroke="none" ${HAND}>${n}</text>`);
const flagArt = () => S(`<path d="M13 35 H29" stroke-width="2.6"/><path d="M21 35 V9" stroke-width="2.8"/>
  <path d="M21 9 H33 V19 H21 Z" fill="#fff" stroke-width="2.4"/><path d="M24 18 L30 11 M28 18 L32 13" stroke-width="1.3"/>`);
const questionArt = () => S(`<text x="21" y="31" text-anchor="middle" font-size="28" font-weight="bold" fill="${INK}" stroke="none" ${HAND}>?</text>`);
const misflagArt = () => flagArt().replace('</svg>', `<path d="M6 6 L36 36 M36 6 L6 36" stroke-width="3.2"/></svg>`);

// 두더지: 해칭된 흙 구멍 + 갈색 몸통(.mole)
function moleArt(big) {
  const eyes = big
    ? `<path d="M13 15 L19 21 M19 15 L13 21 M23 15 L29 21 M29 15 L23 21" stroke-width="2"/>`
    : `<circle cx="15.5" cy="18" r="1.9" fill="${INK}" stroke="none"/><circle cx="26.5" cy="18" r="1.9" fill="${INK}" stroke="none"/>`;
  return S(`
    <ellipse cx="21" cy="35" rx="15" ry="5.5" fill="#fff"/>
    <path d="M9 36 L14 31 M14 38 L20 31 M21 39 L27 31 M28 38 L33 32" stroke="${'#8c8a82'}" stroke-width="1.3"/>
    <g class="mole">
      <path d="M10 35 C8 20 14 6 21 6 C28 6 34 20 32 35 Z" fill="${BROWN}"/>
      <ellipse cx="21" cy="29" rx="7" ry="5.5" fill="${BELLY}" stroke-width="1.4"/>
      ${eyes}
      <ellipse cx="21" cy="23" rx="3.6" ry="2.6" fill="${INK}"/>
      <path d="M12 24 L5 22 M12 26 L5 28 M30 24 L37 22 M30 26 L37 28" stroke-width="1.4"/>
      <path d="M17 28 Q21 31 25 28" stroke-width="1.5"/>
    </g>
    <path d="M6 35 A15 5.5 0 0 0 36 35" fill="#fff" stroke-width="2.4"/>`);
}
function faceArt() {
  let eyes = `<circle cx="29" cy="37" r="2.6" fill="${INK}" stroke="none"/><circle cx="51" cy="37" r="2.6" fill="${INK}" stroke="none"/>`;
  let mouth = `<path d="M31 54 Q40 61 49 54" stroke-width="2.4"/>`;
  if (mouseDownContent) { eyes = `<circle cx="29" cy="37" r="4.4" fill="#fff"/><circle cx="51" cy="37" r="4.4" fill="#fff"/><circle cx="29" cy="37" r="1.7" fill="${INK}" stroke="none"/><circle cx="51" cy="37" r="1.7" fill="${INK}" stroke="none"/>`; mouth = `<ellipse cx="40" cy="57" rx="3.4" ry="4.2" fill="${INK}"/>`; }
  else if (state.status === 'died') { eyes = `<path d="M24 32 L34 42 M34 32 L24 42 M46 32 L56 42 M56 32 L46 42" stroke-width="2.6"/>`; mouth = `<path d="M31 59 Q40 51 49 59" stroke-width="2.4"/>`; }
  else if (state.status === 'won') { eyes = `<path d="M24 38 Q29 31 34 38 M46 38 Q51 31 56 38" stroke-width="2.6"/>`; mouth = `<path d="M30 52 Q40 66 50 52 Z" fill="#fff" stroke-width="2.2"/>`; }
  return S(`
    <ellipse cx="20" cy="22" rx="7.5" ry="7" fill="${BROWN}"/><ellipse cx="60" cy="22" rx="7.5" ry="7" fill="${BROWN}"/>
    <ellipse cx="40" cy="46" rx="26" ry="25" fill="${BROWN}"/>
    <ellipse cx="40" cy="56" rx="15" ry="11" fill="${BELLY}" stroke-width="1.6"/>
    ${eyes}<ellipse cx="40" cy="47" rx="5" ry="3.6" fill="${INK}"/>
    <path d="M24 49 L12 46 M24 52 L12 56 M56 49 L68 46 M56 52 L68 56" stroke-width="1.6"/>
    ${mouth}`, '0 0 80 80');
}
const burst = `<svg viewBox="0 0 100 50" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"><path d="M4 22 L-6 16 M6 36 L-4 40 M52 -6 L50 -16 M88 6 L98 -2 M96 28 L106 30"/></svg>`;

function fmt(number) {
  if (number < 0) { const n = -number % 100; return '-' + (n === 0 ? '00' : n < 10 ? '0' + n : String(n)); }
  const s = number < 999 ? String(number) : '999';
  return number < 10 ? '00' + s : number < 100 ? '0' + s : s;
}
function renderScore() {
  const r = document.getElementById('remain'), s = document.getElementById('secs');
  if (!r) return;
  const flags = state.ceils.filter(c => c.state === 'flag' || c.state === 'misflagged').length;
  r.textContent = fmt(state.mines - flags); s.textContent = fmt(seconds);
}

/* ===== 소리: 뽕! (WebAudio) ===== */
let actx;
function pop() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(720, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
  } catch (e) { /* 소리 실패는 무시 */ }
}

/* ===== 렌더 ===== */
function render() {
  const animate = state.status === 'died';
  const justDied = animate && renderedStatus !== 'died';
  renderedStatus = state.status;

  document.getElementById('diff').textContent = LABEL[state.difficulty];
  document.getElementById('face').innerHTML = faceArt();
  const fm = document.getElementById('flagmode');
  fm.classList.toggle('on', flagMode); fm.setAttribute('aria-pressed', String(flagMode));
  fitCells();

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${state.columns}, var(--c))`;
  grid.style.gridTemplateRows = `repeat(${state.rows}, var(--c))`;
  grid.innerHTML = state.ceils.map((c, i) => {
    const rc = 'rough' + (i % 3);
    let tile = 'cover', art = '', cls = 'cell', extra = '', bubble = '';
    switch (c.state) {
      case 'open': tile = 'open'; art = c.minesAround > 0 ? numArt(c.minesAround) : ''; break;
      case 'flag': art = flagArt(); break;
      case 'unknown': art = questionArt(); break;
      case 'misflagged': tile = 'open'; art = misflagArt(); break;
      case 'mine':
        tile = 'open'; art = moleArt(false); cls += animate ? ' anim' : '';
        extra = ` style="--d:${(0.08 + (i % 7) * 0.05).toFixed(2)}s"`; break;
      case 'die':
        tile = 'open'; art = moleArt(true); cls += ' top' + (animate ? ' anim' : '');
        bubble = `<div class="bubble">뽕!${burst}</div>`; break;
    }
    if (c.opening && tile === 'cover') cls += ' press';
    return `<div class="${cls}"${extra}><div class="tile ${tile} ${rc}"></div>${art}${bubble}</div>`;
  }).join('');

  if (justDied) {
    pop();
    if (navigator.vibrate) navigator.vibrate([40, 30, 70]);   // 안드로이드 진동 (iOS 미지원)
    const stage = document.getElementById('stage');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  }
  renderScore();
  bind();
}

const cellIndex = e => Array.prototype.indexOf.call(document.getElementById('grid').children, e.target.closest('.cell'));
function applyBehavior() {
  const { index, behavior } = openBehavior;
  if (behavior === 'single') openingCeil(index); else if (behavior === 'multi') openingCeils(index); else openingCeil(-1);
}
function bind() {
  const grid = document.getElementById('grid');
  document.getElementById('diff').onclick = () => {
    const next = ORDER[(ORDER.indexOf(state.difficulty) + 1) % ORDER.length];
    dispatch({ type: 'CLEAR_MAP', payload: next }); seconds = 0; commit();
  };
  document.getElementById('face').onclick = () => { dispatch({ type: 'CLEAR_MAP' }); commit(); };
  grid.oncontextmenu = e => e.preventDefault();
  document.getElementById('flagmode').onclick = () => { flagMode = !flagMode; render(); };
  grid.onpointerdown = onTouchDown;
  grid.onmousedown = e => {
    if (Date.now() - lastTouch < 700) return;          // 터치 뒤따라온 가짜 마우스 이벤트
    const index = cellIndex(e);
    if (e.button === 0 && !['won', 'died'].includes(state.status)) mouseDownContent = true;
    if (e.button === 2 && e.buttons === 2 && index !== -1) { changeCeilState(index); commit(); }
    else if (e.button === 0 && e.buttons === 1) { openBehavior = { index, behavior: 'single' }; applyBehavior(); commit(); }
    else if (e.buttons === 3) { openBehavior = { index, behavior: 'multi' }; applyBehavior(); commit(); }
  };
  grid.onmouseover = e => {
    if (Date.now() - lastTouch < 700) return;
    const index = cellIndex(e);
    if (index === openBehavior.index) return;
    openBehavior = { index, behavior: openBehavior.behavior };
    if (openBehavior.behavior) { applyBehavior(); commit(); }
  };
  grid.onmouseup = () => {
    if (Date.now() - lastTouch < 700) return;
    const { behavior, index } = openBehavior;
    if (index === -1) return;
    if (behavior === 'single') { openCeil(index); commit(); } else if (behavior === 'multi') { openCeils(index); commit(); }
  };
}
window.addEventListener('mouseup', () => {
  const had = openBehavior.behavior !== '' || mouseDownContent;
  openBehavior = { index: -1, behavior: '' }; mouseDownContent = false;
  if (had) { applyBehavior(); commit(); }
});

/* ===== 터치: 탭 = 열기, 꾹 누르기 = 깃발, 숫자 칸 탭 = 코드 열기 ===== */
// 누르는 동안 grid 를 다시 그리지 않는다(다시 그리면 손가락이 잡은 요소가 사라져 이벤트가 끊김).
function onTouchDown(e) {
  if (e.pointerType === 'mouse') return;              // 마우스는 기존 mouse* 핸들러가 처리
  if (!touchHint) { touchHint = true; setHint(true); }
  lastTouch = Date.now();
  e.preventDefault();                                  // 뒤따르는 가짜 mouse 이벤트 억제
  cancelTouch();
  const idx = cellIndex(e);
  if (idx === -1) return;
  const el = document.getElementById('grid').children[idx];
  touch = { id: e.pointerId, idx, x: e.clientX, y: e.clientY, long: false, el, timer: null };
  const c = state.ceils[idx];
  if (!['won', 'died'].includes(state.status) && c.state !== 'open') {
    el.classList.add('holding');
    touch.timer = setTimeout(() => {
      if (!touch) return;
      touch.long = true;
      el.classList.remove('holding');
      if (navigator.vibrate) navigator.vibrate(30);
      changeCeilState(idx); commit();
    }, LONG_PRESS_MS);
  }
}
function cancelTouch() {
  if (!touch) return;
  clearTimeout(touch.timer);
  touch.el && touch.el.classList.remove('holding');
  touch = null;
}
window.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id) return;
  if (Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > MOVE_CANCEL_PX) cancelTouch();   // 스크롤 의도
});
window.addEventListener('pointerup', e => {
  if (!touch || e.pointerId !== touch.id) return;
  lastTouch = Date.now();
  const { idx, long } = touch;
  cancelTouch();
  if (long) return;                                    // 꾹 누르기로 이미 처리됨
  const c = state.ceils[idx];
  if (c.state === 'open') { openCeils(idx); commit(); }      // 열린 숫자 칸 탭 = 코드 열기
  else if (flagMode) { changeCeilState(idx); commit(); }     // 깃발 모드의 탭 = 깃발
  else { openCeil(idx); commit(); }                          // 일반 탭 = 열기
});
window.addEventListener('pointercancel', cancelTouch);

/* ===== 화면 폭에 맞춰 칸 크기 조절 + 힌트 문구 ===== */
function fitCells() {
  const room = document.documentElement.clientWidth - (window.innerWidth <= 520 ? 70 : 110);
  const c = Math.max(18, Math.min(42, Math.floor(room / state.columns)));
  document.documentElement.style.setProperty('--c', c + 'px');
}
window.addEventListener('resize', fitCells);
function setHint(touchUi) {
  document.getElementById('hint').textContent = touchUi
    ? '탭: 파기 · 꾹 누르기: 깃발/? · 숫자 칸 탭: 주변 한 번에 열기 · 깃발 모드: 탭으로 깃발 · 고급은 가로 모드 권장'
    : '좌클릭: 파기 · 우클릭: 깃발/? · 숫자 칸 양쪽 클릭: 주변 한 번에 열기 · 위 난이도 글자를 누르면 바뀝니다';
}
setHint(matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || navigator.maxTouchPoints > 0);
// iOS 등: 첫 터치 안에서 오디오를 깨워 둬야 "뽕!" 소리가 난다
window.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}, { once: true });

commit();
</script>
</body>
</html>
